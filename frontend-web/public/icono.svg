<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bus-body { fill: white; stroke: none; }
      .bus-window { fill: #1E3A8A; }
      .bus-detail { fill: #1E3A8A; }
      .person-blue { fill: #3B82F6; }
      .person-green { fill: #22C55E; }
      .pin-green { fill: #22C55E; }
      .pin-white { fill: white; }
      .background { fill: #1E3A8A; }
    </style>
  </defs>
  
  <!-- Fondo azul oscuro con esquinas redondeadas -->
  <rect class="background" width="512" height="512" rx="100"/>
  
  <!-- Bus principal -->
  <g id="bus">
    <!-- Cuerpo principal del bus -->
    <rect class="bus-body" x="120" y="200" width="280" height="160" rx="25"/>
    
    <!-- Ventana principal (parabrisas) -->
    <rect class="bus-window" x="150" y="140" width="180" height="80" rx="15"/>
    
    <!-- Personas en la ventana -->
    <!-- Persona 1 (azul) -->
    <circle class="person-blue" cx="200" cy="170" r="18"/>
    <circle class="person-blue" cx="200" cy="210" r="12"/>
    
    <!-- Persona 2 (verde) -->
    <circle class="person-green" cx="290" cy="185" r="16"/>
    <circle class="person-green" cx="290" cy="215" r="10"/>
    
    <!-- Líneas horizontales en el bus -->
    <line x1="150" y1="290" x2="350" y2="290" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="320" x2="350" y2="320" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ruedas -->
    <circle class="bus-detail" cx="170" cy="375" r="25"/>
    <circle class="bus-body" cx="170" cy="375" r="16"/>
    
    <circle class="bus-detail" cx="330" cy="375" r="25"/>
    <circle class="bus-body" cx="330" cy="375" r="16"/>
    
    <!-- Asas laterales -->
    <rect class="bus-body" x="110" y="220" width="25" height="90" rx="12" stroke="#1E3A8A" stroke-width="3"/>
    <rect class="bus-body" x="380" y="220" width="25" height="90" rx="12" stroke="#1E3A8A" stroke-width="3"/>
    
    <!-- Puerta delantera -->
    <rect class="bus-detail" x="130" y="260" width="50" height="80" rx="8"/>
  </g>
  
  <!-- Pin de ubicación -->
  <g id="location-pin" transform="translate(390, 120)">
    <!-- Círculo verde exterior -->
    <circle class="pin-green" cx="0" cy="0" r="55" stroke="white" stroke-width="4"/>
    
    <!-- Círculo blanco interior -->
    <circle class="pin-white" cx="0" cy="0" r="24"/>
  </g>
</svg>
